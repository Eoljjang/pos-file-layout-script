name: Compile Windows Executable

on:
  push:
    branches:
      - main  # Triggers the build every time you push to the main branch

jobs:
  build:
    runs-on: windows-latest  # Must run on Windows to generate a Windows .exe

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-level: '3.11' # Best practice to use a stable version for compilation

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller

    - name: Build Standalone EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile app.py

    - name: Generate Automatic Release Tag
      id: tag
      run: |
        echo "release_tag=v1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

    - name: Upload EXE to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: Release ${{ steps.tag.outputs.release_tag }}
        body: |
          Automated build generated by GitHub Actions.
          Commit: ${{ github.sha }}
        files: dist/app.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}